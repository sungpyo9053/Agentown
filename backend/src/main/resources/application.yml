spring:
  application:
    name: agent-village
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_village}
    username: ${DB_USERNAME:agent_village}
    password: ${DB_PASSWORD:agent_village_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 7d
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
llm:
  encryption:
    current-version: ${LLM_KEY_VERSION:v1}
    master-keys: ${LLM_MASTER_KEYS:${LLM_KEY_VERSION:v1}:${LLM_MASTER_KEY:}}
execution:
  stub-enabled: ${EXECUTION_STUB_ENABLED:true}
  poll-interval-ms: ${EXECUTION_POLL_INTERVAL_MS:500}
auth:
  sms:
    provider: ${SMS_PROVIDER:stub}
    expose-development-values: ${SMS_EXPOSE_DEVELOPMENT_VALUES:false}
    webhook-url: ${SMS_WEBHOOK_URL:}
    webhook-token: ${SMS_WEBHOOK_TOKEN:}
providers:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  google:
    base-url: ${GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
