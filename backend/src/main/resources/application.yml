spring:
  application:
    name: agent-village
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/agent_village}
    username: ${DB_USERNAME:agent_village}
    password: ${DB_PASSWORD:agent_village_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  session:
    timeout: 7d
release:
  commit-sha: ${RELEASE_COMMIT_SHA:unknown}
  artifact: ${RELEASE_ARTIFACT:local-development}
  agent-token: ${RELEASE_AGENT_TOKEN:}
server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
llm:
  encryption:
    current-version: ${LLM_KEY_VERSION:v1}
    master-keys: ${LLM_MASTER_KEYS:${LLM_KEY_VERSION:v1}:${LLM_MASTER_KEY:}}
execution:
  stub-enabled: ${EXECUTION_STUB_ENABLED:true}
  poll-interval-ms: ${EXECUTION_POLL_INTERVAL_MS:500}
designer:
  template-enabled: ${DESIGNER_TEMPLATE_ENABLED:true}
  platform-model: ${DESIGNER_PLATFORM_MODEL:gpt-5.6-luna}
auth:
  email:
    provider: ${EMAIL_PROVIDER:stub}
    expose-development-values: ${EMAIL_EXPOSE_DEVELOPMENT_VALUES:false}
    webhook-url: ${EMAIL_WEBHOOK_URL:}
    webhook-token: ${EMAIL_WEBHOOK_TOKEN:}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@reviewdr.kr}
    ses-region: ${EMAIL_SES_REGION:ap-northeast-2}
    ses-access-key: ${EMAIL_SES_ACCESS_KEY:}
    ses-secret-key: ${EMAIL_SES_SECRET_KEY:}
providers:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
  anthropic:
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
  google:
    base-url: ${GOOGLE_BASE_URL:https://generativelanguage.googleapis.com}
security:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    trust-forwarded-for: ${TRUST_FORWARDED_FOR:false}
builder:
  meta-agent:
    mode: ${BUILDER_META_AGENT_MODE:real}
    codex-command: ${BUILDER_CODEX_COMMAND:codex}
    model: ${BUILDER_CODEX_MODEL:gpt-5.6-luna}
    timeout-seconds: ${BUILDER_CODEX_TIMEOUT_SECONDS:120}
    unlimited-owner-ids: ${BUILDER_UNLIMITED_OWNER_IDS:}
    shared-codex-home: ${BUILDER_SHARED_CODEX_HOME:/var/lib/agentown-codex}
connectors:
  slack:
    enabled: ${SLACK_CONNECTOR_ENABLED:false}
    client-id: ${SLACK_CLIENT_ID:}
    client-secret: ${SLACK_CLIENT_SECRET:}
    signing-secret: ${SLACK_SIGNING_SECRET:}
    redirect-uri: ${SLACK_REDIRECT_URI:http://localhost:8080/api/connectors/slack/oauth/callback}
    frontend-result-url: ${SLACK_FRONTEND_RESULT_URL:http://localhost:3000/settings/connections}
    event-request-url: ${SLACK_EVENT_REQUEST_URL:http://localhost:8080/api/connectors/slack/events}
    scopes: ${SLACK_SCOPES:channels:history,chat:write}
    api-base-url: ${SLACK_API_BASE_URL:https://slack.com}
  notion:
    enabled: ${NOTION_CONNECTOR_ENABLED:false}
    client-id: ${NOTION_CLIENT_ID:}
    client-secret: ${NOTION_CLIENT_SECRET:}
    redirect-uri: ${NOTION_REDIRECT_URI:http://localhost:8080/api/connectors/notion/oauth/callback}
    frontend-result-url: ${NOTION_FRONTEND_RESULT_URL:http://localhost:3000/settings/connections}
    api-base-url: ${NOTION_API_BASE_URL:https://api.notion.com}
    api-version: ${NOTION_API_VERSION:2026-03-11}
notion:
  template-library:
    enabled: ${NOTION_TEMPLATE_LIBRARY_ENABLED:false}
    token: ${NOTION_TEMPLATE_TOKEN:}
    data-source-id: ${NOTION_TEMPLATE_DATA_SOURCE_ID:}
    api-base-url: ${NOTION_API_BASE_URL:https://api.notion.com}
    api-version: ${NOTION_API_VERSION:2026-03-11}
