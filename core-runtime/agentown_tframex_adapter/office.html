<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>나의 AI 회사 · Agentown 로컬</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9e7e0;color:#273c3b;font-family:system-ui,sans-serif}header,main,footer{max-width:1120px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;gap:20px;align-items:center}h1{font-size:24px;margin:5px 0}p{line-height:1.6}small{color:#526562}button{cursor:pointer;font:inherit}button:focus-visible{outline:3px solid #c65e3e;outline-offset:4px}.toggle{padding:10px 16px;background:#fff;border:1px solid #c3cecb;border-radius:24px}.room{background:#f7f3e9;border:1px solid #c7cec5;border-radius:20px;overflow:hidden;box-shadow:0 15px 40px #273c3b12}.windows{height:150px;background:linear-gradient(#b9d8d9,#edf0df);border-bottom:12px solid #bac7bd;display:flex;gap:12px;padding:0 40px}.window{flex:1;border-inline:8px solid #f9f7ef;position:relative;overflow:hidden}.window:before{content:'';position:absolute;width:32%;height:70%;background:#96b9ba;bottom:0;left:10%;box-shadow:60px 25px #aac6c3,130px -15px #a3bebd}.floor{padding:26px;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:24px;background:repeating-linear-gradient(0deg,transparent 0 89px,#dedfd13d 90px 91px)}.employee{border:2px solid transparent;border-radius:14px;background:#ffffff6e;color:inherit;text-align:center;padding:12px;min-width:0}.employee[aria-pressed=true]{border-color:#44766c;background:#fff}.desk{height:145px;position:relative}.table{position:absolute;top:55px;left:5%;width:90%;height:40px;background:#d5b18b;border-radius:10px;box-shadow:0 9px #b18e70}.screen{position:absolute;top:10px;left:32%;width:36%;height:49px;background:#304649;border:5px solid #586f6b;border-radius:5px;box-shadow:0 9px #73837b}.screen:after{content:'···';color:#a4d8bb}.body{position:absolute;top:80px;left:34%;width:32%;height:57px;background:var(--shirt);border-radius:24px 24px 10px 10px}.head{position:absolute;top:56px;left:40%;width:20%;height:34px;background:#655047;border-radius:48% 48% 42% 42%}.chair{position:absolute;top:109px;left:30%;width:40%;height:35px;background:#667d72;border-radius:12px;box-shadow:0 5px #4d635b}.cup{position:absolute;top:53px;right:12%;height:17px;width:14px;background:#faf8f1;border-radius:0 0 4px 4px}.name{display:block;font-weight:650;margin-top:9px;overflow-wrap:anywhere}.badge{display:inline-block;padding:4px 10px;border-radius:20px;background:#e5e9e4;font-size:12px;margin:8px 0}.employee[data-status=RUNNING] .badge{background:#d6eee0;color:#255844}.employee[data-status=FAILED] .badge{background:#f5dcd4;color:#873e30}.employee[data-status=RUNNING] .head{animation:work 1s ease-in-out infinite}.employee[data-status=RUNNING] .screen{animation:screen 1.5s ease-in-out infinite}.paused *{animation:none!important}@keyframes work{50%{transform:translateY(2px) rotate(3deg)}}@keyframes screen{50%{background:#477261}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}.detail{margin-top:24px;background:#fff;padding:24px;border-radius:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.7;font-family:inherit;font-size:14px}#connection{font-size:13px}footer{font-size:12px;color:#526562}@media(max-width:560px){header,main,footer{padding:16px}.floor{padding:12px;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}.windows{height:100px;padding:0 15px}.employee{padding:7px}.name{font-size:13px}h1{font-size:20px}.toggle{font-size:12px}}
.desk{width:190px;max-width:100%;margin:auto}.head{width:36px;left:calc(50% - 18px)}.body{width:62px;left:calc(50% - 31px)}.chair{width:76px;left:calc(50% - 38px)}.floor{grid-template-columns:repeat(auto-fit,minmax(180px,230px));justify-content:center;min-height:285px}.employee{align-self:start}.windows{position:relative}.windows:after{content:'🌿';position:absolute;bottom:-5px;right:20px;font-size:45px}@media(max-width:560px){.floor{grid-template-columns:repeat(2,minmax(0,1fr))}.head{width:30px;left:calc(50% - 15px)}}
</style>
<header><div><small>AGENTOWN · LOCAL OFFICE</small><h1 id="company">나의 AI 회사</h1><div id="connection" role="status">로컬 실행기에 연결 중…</div></div><button class="toggle" id="motion">움직임 끄기</button></header>
<main><section class="room" aria-label="에이전트 사무실"><div class="windows" aria-hidden="true"><i class="window"></i><i class="window"></i><i class="window"></i></div><div class="floor" id="employees"></div></section><section class="detail"><h2 id="person">직원을 선택해 주세요</h2><p id="role">직원이 곧 패키지의 에이전트입니다. 실제 실행 이벤트에만 작업 중으로 표시됩니다.</p><pre id="output"></pre></section></main>
<footer><button class="toggle" id="save" disabled>선택한 직원 결과 저장</button><p>이 화면과 애니메이션은 내 PC에서 실행됩니다. AI 호출은 설정한 제공자를 사용하며 인터넷과 이용 권한이 필요합니다. 화면을 닫아도 실행은 계속됩니다. 실행기를 종료하면 연결이 끊깁니다.</p></footer>
<script>
const labels={IDLE:'대기',RUNNING:'작업 중',SUCCEEDED:'완료',FAILED:'실패 · 확인 필요',INTERRUPTED:'중단',EXECUTION_NOT_CONFIGURED:'실행 설정 필요'};
const colors=['#7d998d','#b38c79','#7f99b0','#c2a56f','#9b89ac','#829f9e'];let selected=null,buttons=new Map();
function readable(value){if(typeof value==='string'){try{return readable(JSON.parse(value))}catch{return value}}if(Array.isArray(value))return value.map((item,index)=>(index+1)+'. '+readable(item)).join('\n');if(value&&typeof value==='object')return Object.entries(value).map(([key,item])=>key+'\n'+readable(item)).join('\n\n');return String(value)}
document.querySelector('#save').onclick=()=>{const text=document.querySelector('#person').textContent+'\n\n'+document.querySelector('#output').textContent;const url=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='agentown-employee-result.txt';link.click();setTimeout(()=>URL.revokeObjectURL(url),60000)};
document.querySelector('#motion').onclick=()=>{const paused=document.body.classList.toggle('paused');document.querySelector('#motion').textContent=paused?'움직임 켜기':'움직임 끄기'};
function paint(state){document.querySelector('#company').textContent=state.name;document.querySelector('#connection').textContent='내 PC 실행 · '+(labels[state.status]||state.status);const employees=state.employees;selected=selected||employees[0]?.key;
employees.forEach((employee,index)=>{let button=buttons.get(employee.key);if(!button){button=document.createElement('button');button.className='employee';button.style.setProperty('--shirt',colors[index%colors.length]);button.innerHTML='<div class="desk" aria-hidden="true"><i class="table"></i><i class="screen"></i><i class="cup"></i><i class="body"></i><i class="head"></i><i class="chair"></i></div><span class="name"></span><span class="badge"></span>';buttons.set(employee.key,button);document.querySelector('#employees').append(button)}button.onclick=()=>{selected=employee.key;paint(state)};button.dataset.status=employee.status;button.setAttribute('aria-pressed',String(employee.key===selected));button.querySelector('.name').textContent=employee.name;button.querySelector('.badge').textContent=labels[employee.status]||employee.status});
const person=employees.find(e=>e.key===selected);if(person){document.querySelector('#person').textContent=person.name;document.querySelector('#role').textContent=person.role;document.querySelector('#output').textContent=person.output?readable(person.output):'아직 이 직원의 실행 결과가 없습니다.';document.querySelector('#save').disabled=!person.output}}
async function poll(){try{const response=await fetch('state',{cache:'no-store'});if(!response.ok)throw Error();paint(await response.json())}catch{document.querySelector('#connection').textContent='실행기 연결 끊김 · 마지막 상태입니다';document.body.classList.add('paused')}finally{setTimeout(poll,1500)}}poll();
</script></html>
