name: Native runtime candidates
on:
  workflow_dispatch:
  push:
    branches: ['work/native-runtime-*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x86_64
          - os: macos-15-intel
            target: macos-x86_64
          - os: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install './core-runtime[artifacts]' 'pyinstaller==6.22.2'
      - run: python core-runtime/build_native.py --package native-fixture --output native-output
      # Preserve executable bits and symlinks on the build host.
      - run: python -c "import shutil; shutil.make_archive('native-candidate', 'gztar', 'native-output')"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-${{ matrix.target }}
          path: native-candidate.tar.gz
          if-no-files-found: error
