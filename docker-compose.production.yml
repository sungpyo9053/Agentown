services:
  codex-auth-init:
    image: alpine:3.20
    restart: "no"
    user: "0:0"
    volumes:
      - ./deploy/codex-auth:/source:ro
      - codex_auth:/target
    command: >
      sh -ec 'test -r /source/auth.json;
      rm -rf /target/*;
      cp -a /source/. /target/;
      chown -R 10001:10001 /target;
      find /target -type d -exec chmod 700 {} +;
      find /target -type f -exec chmod 600 {} +'

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_village}
      POSTGRES_USER: ${POSTGRES_USER:-agent_village}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-agent_village}
      DB_USERNAME: ${POSTGRES_USER:-agent_village}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      # Transitional release: production recorded V22/V23 before V21 existed.
      # Apply the known V21 gap, then V24 makes the resulting schema idempotent.
      SPRING_FLYWAY_OUT_OF_ORDER: "true"
      LLM_KEY_VERSION: ${LLM_KEY_VERSION:-v1}
      LLM_MASTER_KEYS: ${LLM_MASTER_KEYS:?Set versioned LLM_MASTER_KEYS}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${DOMAIN:?Set DOMAIN},https://${ALT_DOMAIN:-agentown.${DOMAIN}}
      RATE_LIMIT_ENABLED: "true"
      TRUST_FORWARDED_FOR: "true"
      EXECUTION_STUB_ENABLED: "false"
      DESIGNER_TEMPLATE_ENABLED: "true"
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-ses}
      EMAIL_EXPOSE_DEVELOPMENT_VALUES: "false"
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_TOKEN: ${EMAIL_WEBHOOK_TOKEN:-}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-no-reply@reviewdr.kr}
      EMAIL_SES_REGION: ${EMAIL_SES_REGION:-ap-northeast-2}
      EMAIL_SES_ACCESS_KEY: ${EMAIL_SES_ACCESS_KEY:-}
      EMAIL_SES_SECRET_KEY: ${EMAIL_SES_SECRET_KEY:-}
      BUILDER_CODEX_COMMAND: /usr/local/bin/codex
      BUILDER_META_AGENT_MODE: real
      BUILDER_CODEX_MODEL: ${BUILDER_CODEX_MODEL:-gpt-5.6-luna}
      BUILDER_CODEX_TIMEOUT_SECONDS: ${BUILDER_CODEX_TIMEOUT_SECONDS:-120}
      BUILDER_UNLIMITED_OWNER_IDS: ${BUILDER_UNLIMITED_OWNER_IDS:-}
      BUILDER_SHARED_CODEX_HOME: /home/app/.codex
      BUILDER_TFRAMEX_RUNTIME_URL: http://core-runtime:8090
      CONTENT_OPERATIONS_PLATFORM_MODEL: ${CONTENT_OPERATIONS_PLATFORM_MODEL:-gpt-5.6-luna}
      CONTENT_OPERATIONS_MONTHLY_MANAGED_LIMIT: ${CONTENT_OPERATIONS_MONTHLY_MANAGED_LIMIT:-30}
      RELEASE_COMMIT_SHA: ${RELEASE_COMMIT_SHA:-unknown}
      RELEASE_ARTIFACT: ${RELEASE_ARTIFACT:-docker-compose-local-build}
      RELEASE_AGENT_TOKEN: ${RELEASE_AGENT_TOKEN:-}
      SLACK_CONNECTOR_ENABLED: ${SLACK_CONNECTOR_ENABLED:-false}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_REDIRECT_URI: ${SLACK_REDIRECT_URI:-https://${DOMAIN}/api/connectors/slack/oauth/callback}
      SLACK_FRONTEND_RESULT_URL: ${SLACK_FRONTEND_RESULT_URL:-https://${DOMAIN}/settings/connections}
      SLACK_EVENT_REQUEST_URL: ${SLACK_EVENT_REQUEST_URL:-https://${DOMAIN}/api/connectors/slack/events}
      SLACK_SCOPES: ${SLACK_SCOPES:-channels:history,chat:write}
      NOTION_CONNECTOR_ENABLED: ${NOTION_CONNECTOR_ENABLED:-false}
      NOTION_CLIENT_ID: ${NOTION_CLIENT_ID:-}
      NOTION_CLIENT_SECRET: ${NOTION_CLIENT_SECRET:-}
      NOTION_REDIRECT_URI: ${NOTION_REDIRECT_URI:-https://${DOMAIN}/api/connectors/notion/oauth/callback}
      NOTION_FRONTEND_RESULT_URL: ${NOTION_FRONTEND_RESULT_URL:-https://${DOMAIN}/settings/connections}
      NOTION_TEMPLATE_LIBRARY_ENABLED: ${NOTION_TEMPLATE_LIBRARY_ENABLED:-false}
      NOTION_TEMPLATE_TOKEN: ${NOTION_TEMPLATE_TOKEN:-}
      NOTION_TEMPLATE_DATA_SOURCE_ID: ${NOTION_TEMPLATE_DATA_SOURCE_ID:-}
      NOTION_API_VERSION: ${NOTION_API_VERSION:-2026-03-11}
    volumes:
      - codex_auth:/home/app/.codex
    depends_on:
      codex-auth-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      core-runtime:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 20

  core-runtime:
    build:
      context: .
      dockerfile: core-runtime/Dockerfile
    restart: unless-stopped
    environment:
      CODEX_HOME: /home/app/.codex
      AGENTOWN_CODEX_COMMAND: /usr/local/bin/codex
      AGENTOWN_CODEX_MODEL: ${BUILDER_CODEX_MODEL:-gpt-5.6-luna}
      AGENTOWN_CODEX_TIMEOUT_SECONDS: ${BUILDER_CODEX_TIMEOUT_SECONDS:-120}
    volumes:
      - codex_auth:/home/app/.codex:ro
    depends_on:
      codex-auth-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/ready')"]
      interval: 10s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        API_INTERNAL_URL: http://backend:8080
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8080
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
      ALT_DOMAIN: ${ALT_DOMAIN:-agentown.${DOMAIN}}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres_data:
  codex_auth:
  caddy_data:
  caddy_config:
